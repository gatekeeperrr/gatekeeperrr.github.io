{{ define "main" }}
<h2 class="section-title">blog</h2>
<div class="post-list">
  {{ range .Pages }}
    <div class="post-item">
      <div class="post-date">{{ .Date.Format "Jan 2, 2006" }}</div>
      <a class="post-title" href="{{ .RelPermalink }}">{{ .Title }}</a>
    </div>
  {{ else }}
  <p style="color:var(--muted);font-size:13px;">no posts yet.</p>
  {{ end }}
</div>
{{ end }}
